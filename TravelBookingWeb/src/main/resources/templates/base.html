<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:fragment="head(title, extraHead)">
        <title th:replace="${title}">Travel Admin</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/styles.css}" rel="stylesheet">
        <th:block th:replace="${extraHead} ?: ~{}"></th:block>
    </head>
    <body>
        <aside class="admin-sidebar" th:fragment="sidebar">
            <h4>Travel Admin</h4>
            <a th:href="@{/admin}">Dashboard</a>
            <a th:href="@{/admin/users}">Người dùng</a>
            <a th:href="@{/admin/providers}">Duyệt provider</a>
            <a th:href="@{/admin/services}">Dịch vụ</a>
            <a th:href="@{/admin/reviews}">Đánh giá</a>
            <a th:href="@{/admin/payments}">Thanh toán</a>
        </aside>

        <th:block th:fragment="scripts(extraScripts)">
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            <th:block th:replace="${extraScripts} ?: ~{}"></th:block>
        </th:block>
    </body>
</html>
