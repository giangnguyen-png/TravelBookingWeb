<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{base :: head(~{::title}, ~{::extraHead})}">
        <title>Admin Login</title>
        <th:block th:fragment="extraHead"></th:block>
    </head>
    <body class="auth-page">
        <form class="auth-box" th:action="@{/login}" method="post">
            <h1 class="h4 mb-3">Travel Admin</h1>
            <div class="alert alert-danger" th:if="${param.error}">Sai tên đăng nhập hoặc mật khẩu.</div>
            <div class="alert alert-success" th:if="${param.logout}">Bạn đã đăng xuất.</div>
            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input class="form-control" name="username" autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input class="form-control" type="password" name="password" autocomplete="current-password">
            </div>
            <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
        </form>
    </body>
</html>
